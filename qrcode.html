<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A4 二维码页 · 燕郊非遗田野档案</title>
  <script src="js/config.js?v=2.2.19"></script>
  <!-- 本地二维码生成（免联网 API，推荐） -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --orange: #ea580c;
      --blue: #1d4ed8;
      --gold: #d4af37;
      --paper: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e2e8f0;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .toolbar button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
      box-shadow: 0 8px 20px rgba(29,78,216,0.25);
    }

    .toolbar button.secondary {
      background: #0f172a;
    }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      background: var(--paper);
      box-shadow: 0 20px 50px rgba(15,23,42,0.18);
      padding: 18mm 16mm;
      position: relative;
      overflow: hidden;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(234,88,12,0.12), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(29,78,216,0.12), transparent 30%),
        linear-gradient(180deg, #ffffff, #f8fafc);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18mm;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: rgba(255,255,255,0.8);
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--blue));
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }

    h1 {
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 22px;
    }

    .qr-box {
      width: 78mm;
      height: 78mm;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(15,23,42,0.1);
      box-shadow: 0 16px 40px rgba(15,23,42,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      padding: 10px;
    }

    #qrcode canvas,
    #qrcode img {
      width: 100% !important;
      height: 100% !important;
    }

    .scan-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .scan-hint {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .url {
      max-width: 150mm;
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
      background: rgba(15,23,42,0.04);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 150mm;
      margin-bottom: 20px;
    }

    .stat {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 14px;
      padding: 12px 8px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: var(--blue);
      margin-bottom: 2px;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .tips {
      text-align: left;
      width: 100%;
      max-width: 150mm;
      background: rgba(255,255,255,0.75);
      border: 1px dashed rgba(15,23,42,0.15);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .tips li { margin-left: 18px; margin-bottom: 4px; }

    .footer {
      margin-top: 16mm;
      display: flex;
      justify-content: space-between;
      align-items: end;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid rgba(15,23,42,0.08);
      padding-top: 10px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #f59e0b, #1d4ed8, #d4af37, #f59e0b);
      position: relative;
    }

    .brand-mark::after {
      content: "非遗";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .toolbar { display: none !important; }
      .sheet {
        width: 210mm;
        min-height: 297mm;
        box-shadow: none;
        margin: 0;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="secondary" onclick="window.location.href='index.html'">返回档案</button>
    <button onclick="window.print()">打印 A4</button>
  </div>

  <div class="sheet">
    <div class="content">
      <div class="top">
        <div class="badge"><span class="dot"></span><span id="seasonText">2026 暑期社会实践</span></div>
        <div class="brand-mark"></div>
      </div>

      <div class="main">
        <h1 id="titleText">燕郊非遗田野档案</h1>
        <div class="subtitle" id="subtitleText">景泰蓝田野档案</div>
        <div class="tagline" id="taglineText">从工序到传承，看见非遗如何被理解与参与</div>

        <div class="qr-box">
          <div id="qrcode"></div>
        </div>

        <div class="scan-title" id="printTitle">扫码进入田野档案</div>
        <div class="scan-hint" id="printHint">建议使用微信扫一扫 / 浏览器扫码</div>
        <div class="url" id="siteUrlText">https://your-username.github.io/yanjiao-ich-archive/</div>

        <div class="stats">
          <div class="stat"><strong id="observeCount">6</strong><span>次观察</span></div>
          <div class="stat"><strong id="interviewCount">12</strong><span>人访谈</span></div>
          <div class="stat"><strong id="routeCount">2</strong><span>条线路</span></div>
        </div>

        <div class="tips">
          <ul id="tipList">
            <li>建议横向打印为 A4</li>
            <li>答辩现场可放在桌面或海报旁</li>
            <li>请确认链接已部署并可访问</li>
          </ul>
        </div>
      </div>

      <div class="footer">
        <div>
          <div id="teamName">「畿辅文薪·匠心永续」数字化调研实践团</div>
          <div>指导教师：<span id="advisor">赵鹏凯</span></div>
          <div>调研地点：<span id="surveyPlace">河北省廊坊市三河市</span></div>
        </div>
        <div id="surveyTime">2026年7月16日至19日</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const cfg = window.PROJECT_CONFIG || {};
      const meta = cfg.meta || {};
      const stats = cfg.stats || {};
      const links = cfg.links || {};
      const qr = cfg.qrcodePage || {};

      const siteUrl = links.siteUrl || "https://your-username.github.io/yanjiao-ich-archive/";

      // 文本填充
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el && value != null) el.textContent = String(value);
      };

      setText("seasonText", `${meta.year || "2026"} ${meta.season || "暑期社会实践"}`);
      setText("titleText", meta.title || "燕郊非遗田野档案");
      setText("subtitleText", meta.subtitle || "景泰蓝田野档案");
      setText("taglineText", meta.tagline || "");
      setText("printTitle", qr.printTitle || "扫码进入田野档案");
      setText("printHint", qr.printHint || "建议使用微信扫一扫 / 浏览器扫码");
      setText("siteUrlText", siteUrl);
      setText("observeCount", stats.observeCount ?? 6);
      setText("interviewCount", stats.interviewCount ?? 12);
      setText("routeCount", stats.routeCount ?? 2);
      setText("teamName", meta.teamName || "");
      setText("advisor", meta.advisor || "");
      setText("surveyTime", meta.surveyTime || "");
      setText("surveyPlace", meta.surveyPlace || "");

      // tip lines
      const tipList = document.getElementById("tipList");
      if (tipList && Array.isArray(qr.tipLines) && qr.tipLines.length) {
        tipList.innerHTML = qr.tipLines.map((t) => `<li>${t}</li>`).join("");
      }

      // 生成二维码
      const qrHost = document.getElementById("qrcode");
      if (window.QRCode && qrHost) {
        QRCode.toCanvas(siteUrl, {
          width: 280,
          margin: 1,
          color: { dark: "#0f172a", light: "#ffffff" }
        }, function (err, canvas) {
          if (err) {
            qrHost.textContent = "二维码生成失败，请检查 siteUrl";
            console.error(err);
            return;
          }
          qrHost.innerHTML = "";
          qrHost.appendChild(canvas);
        });
      } else {
        qrHost.textContent = "二维码库加载失败，请联网后重试";
      }
    })();
  </script>
</body>
</html>
