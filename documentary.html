<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="燕郊非遗田野档案 · 微纪录片" />
  <title>观看纪录片 · 燕郊非遗田野档案</title>
  <link rel="stylesheet" href="css/style.css?v=2.2.48" />
</head>
<body class="page-documentary">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <section class="screen documentary-screen">
    <div class="wrap reveal show">
      <div class="eyebrow"><span class="dot"></span>微纪录片</div>
      <h1 class="title-lg">燕郊非遗田野档案</h1>
      <p class="lead">工序见匠心，一器载山河</p>

      <div class="glass card documentary-card">
        <div class="documentary-player" id="documentaryPlayer">
          <video
            id="documentaryVideo"
            class="documentary-video"
            controls
            playsinline
            webkit-playsinline
            autoplay
            muted
            preload="auto"
            poster="images/documentary-poster.jpg"
            controlslist="nodownload"
          >
            <source src="videos/documentary.mp4" type="video/mp4" />
          </video>
        </div>
        <p class="muted-text documentary-hint" id="documentaryHint">正在加载纪录片…</p>
      </div>

      <div class="cta-row cta-left">
        <button type="button" class="btn btn-primary" id="documentaryBackBtn">返回</button>
      </div>
    </div>
  </section>

  <script src="js/config.js?v=2.2.48"></script>
  <script>
    (function () {
      const STORAGE_PATH = "yanjiao:docReturnPath";
      const video = document.getElementById("documentaryVideo");
      const player = document.getElementById("documentaryPlayer");
      const backBtn = document.getElementById("documentaryBackBtn");
      const hint = document.getElementById("documentaryHint");
      const cfg = window.PROJECT_CONFIG || {};
      const media = cfg.media || {};
      const src = media.documentaryVideo || "videos/documentary.mp4";
      const poster = media.documentaryPoster || "images/documentary-poster.jpg";

      function fitPlayer() {
        if (!video || !player) return;
        player.style.width = "";
        player.style.height = "";
        player.style.minWidth = "";
        player.style.minHeight = "";
        player.style.maxHeight = "";
        player.style.aspectRatio = "";
        video.style.width = "";
        video.style.height = "";

        const screen = document.querySelector(".documentary-screen");
        const wrap = document.querySelector(".page-documentary .wrap");
        const eyebrow = wrap && wrap.querySelector(".eyebrow");
        const title = wrap && wrap.querySelector(".title-lg");
        const lead = wrap && wrap.querySelector(".lead");
        const cta = wrap && wrap.querySelector(".cta-row");
        const hintEl = document.getElementById("documentaryHint");

        function h(el) {
          if (!el) return 0;
          const st = window.getComputedStyle(el);
          if (st.display === "none") return 0;
          return el.getBoundingClientRect().height;
        }

        const chrome = h(eyebrow) + h(title) + h(lead) + h(hintEl) + h(cta) + 36;
        const pad = screen
          ? (parseFloat(window.getComputedStyle(screen).paddingTop) || 0) +
            (parseFloat(window.getComputedStyle(screen).paddingBottom) || 0)
          : 0;
        const availH = Math.max(140, (window.innerHeight || 480) - chrome - pad);
        const availW = Math.max(
          140,
          (player.parentElement && player.parentElement.clientWidth) ||
            (wrap && wrap.clientWidth) ||
            window.innerWidth ||
            320
        );

        let w = availW;
        let ht = (w * 9) / 16;
        if (ht > availH) {
          ht = availH;
          w = Math.min(availW, (ht * 16) / 9);
        }
        player.style.width = Math.floor(w) + "px";
        player.style.height = Math.floor(ht) + "px";
        player.style.maxHeight = "none";
        player.style.aspectRatio = "auto";
        video.style.width = "100%";
        video.style.height = "100%";
      }

      fitPlayer();
      window.addEventListener("resize", fitPlayer);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(fitPlayer, 160);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitPlayer);
      }

      if (video) {
        let playStarted = false;
        let playTries = 0;

        video.setAttribute("poster", poster);
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.playsInline = true;
        video.muted = true; // 手机端自动播放必须静音起步
        video.defaultMuted = true;
        video.setAttribute("muted", "");
        video.setAttribute("autoplay", "");

        const source = video.querySelector("source");
        if (source) source.src = src;
        video.src = src;

        function setHint(text) {
          if (hint) hint.textContent = text;
        }

        function startPlayWhenReady() {
          if (playStarted) return;
          if (video.readyState < 3 && video.networkState === 2) {
            // HAVE_FUTURE_DATA 未到且仍在加载：继续等
            setHint("正在加载纪录片…");
            return;
          }
          // readyState >= 2(HAVE_CURRENT_DATA) 即可尝试开播
          if (video.readyState < 2) {
            setHint("正在加载纪录片…");
            return;
          }

          playTries += 1;
          setHint("加载完成，正在自动播放…");
          video.muted = true;

          const p = video.play();
          if (p && typeof p.then === "function") {
            p.then(function () {
              playStarted = true;
              setHint("播放中（可点控件开声音）；结束后点「返回」回到原位置");
              // 自动开播成功后再试一次取消静音（失败则保持静音继续播）
              window.setTimeout(function () {
                try {
                  video.muted = false;
                } catch (e) {
                  video.muted = true;
                }
              }, 400);
            }).catch(function () {
              if (playTries < 8) {
                window.setTimeout(startPlayWhenReady, 350);
                return;
              }
              setHint("已加载完成，请点一下画面开始播放");
            });
          } else {
            playStarted = true;
          }
        }

        video.addEventListener("loadstart", function () {
          setHint("正在加载纪录片…");
        });
        video.addEventListener("loadedmetadata", fitPlayer);
        video.addEventListener("loadeddata", startPlayWhenReady);
        video.addEventListener("canplay", startPlayWhenReady);
        video.addEventListener("canplaythrough", startPlayWhenReady);
        video.addEventListener("playing", function () {
          playStarted = true;
          setHint("播放中（可点控件开声音）；结束后点「返回」回到原位置");
        });
        video.addEventListener("waiting", function () {
          if (!playStarted) setHint("正在缓冲…");
        });
        video.addEventListener("ended", function () {
          setHint("播放完成，点「返回」可回到刚才浏览的位置");
        });
        video.addEventListener("error", function () {
          setHint("视频加载失败，请检查网络后重试");
        });

        try {
          video.load();
        } catch (e) {
          /* ignore */
        }

        // 兜底轮询：弱网下事件可能不全
        var poll = 0;
        var timer = window.setInterval(function () {
          poll += 1;
          startPlayWhenReady();
          if (playStarted || poll > 40) window.clearInterval(timer);
        }, 400);
      }

      function goBack() {
        const path = sessionStorage.getItem(STORAGE_PATH) || "index.html";
        if (window.history.length > 1) {
          const ref = document.referrer || "";
          const sameOrigin = !ref || ref.indexOf(location.origin) === 0;
          if (sameOrigin) {
            history.back();
            return;
          }
        }
        location.href = path.indexOf("documentary.html") >= 0 ? "index.html" : path;
      }

      if (backBtn) backBtn.addEventListener("click", goBack);
    })();
  </script>
</body>
</html>
